<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Assistant</title>

    <style>
        body {
            max-width: 760px;
            margin: 30px auto;
            padding: 0 16px;
            font-family: system-ui, sans-serif;
            background: #f6f7fb;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0001;
        }

        #messages {
            height: 460px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        .user {
            background: #dbeafe;
            margin-left: 20%;
        }

        .assistant {
            background: #f1f5f9;
            margin-right: 20%;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            padding: 12px;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #status {
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Shopping Assistant</h2>

    <div id="login">
        <div class="row">
            <input id="email"
                   type="email"
                   placeholder="Customer email">

            <button onclick="login()">Sign in</button>
        </div>
    </div>

    <div id="chat" hidden>
        <div class="row">
            <span id="customer"></span>
            <button onclick="logout()">Sign out</button>
        </div>

        <div id="messages"></div>

        <form id="chat-form" class="row">
            <input id="query"
                   placeholder="Ask about your cart or orders"
                   autocomplete="off">

            <button type="submit">Send</button>
        </form>
    </div>

    <div id="status"></div>
</div>

<script>
    const api = "/api/v1";

    let token = localStorage.getItem("shopToken");
    let customerEmail = localStorage.getItem("customerEmail");

    const loginSection = document.getElementById("login");
    const chatSection = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");

    if (token) {
        showChat();
    }

    async function login() {
        const email = document.getElementById("email")
            .value
            .trim();

        if (!email) {
            setStatus("Enter an email address.");
            return;
        }

        setStatus("Signing in...");

        try {
            const response = await fetch(
                `${api}/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({email})
                }
            );

            const data = await readResponse(response);

            token = data.access_token;
            customerEmail = data.customer?.email ?? email;

            localStorage.setItem("shopToken", token);
            localStorage.setItem(
                "customerEmail",
                customerEmail
            );

            showChat();
            setStatus("");
        } catch (error) {
            setStatus(`Sign-in failed: ${error.message}`);
        }
    }

    document.getElementById("chat-form")
        .addEventListener("submit", async event => {
            event.preventDefault();

            const input = document.getElementById("query");
            const query = input.value.trim();

            if (!query) return;

            input.value = "";
            addMessage("user", query);
            setStatus("Thinking...");

            try {
                const authorization = encodeURIComponent(
                    `Bearer ${token}`
                );

                const response = await fetch(
                    `${api}/chat?authorization=${authorization}`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({query})
                    }
                );

                const data = await readResponse(response);
                addMessage("assistant", data.answer);
                setStatus("");
            } catch (error) {
                addMessage(
                    "assistant",
                    `Request failed: ${error.message}`
                );
                setStatus("");
            }
        });

    async function logout() {
        try {
            const authorization = encodeURIComponent(
                `Bearer ${token}`
            );

            await fetch(
                `${api}/chat/history?authorization=${authorization}`,
                {
                    method: "DELETE"
                }
            );
        } finally {
            token = null;
            customerEmail = null;

            localStorage.removeItem("shopToken");
            localStorage.removeItem("customerEmail");

            messages.innerHTML = "";
            chatSection.hidden = true;
            loginSection.hidden = false;
            setStatus("");
        }
    }

    function showChat() {
        loginSection.hidden = true;
        chatSection.hidden = false;

        document.getElementById("customer").textContent =
            `Signed in as ${customerEmail ?? "customer"}`;
    }

    function addMessage(role, content) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = content;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
    }

    async function readResponse(response) {
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.detail ??
                data.title ??
                `HTTP ${response.status}`
            );
        }

        return data;
    }

    function setStatus(message) {
        status.textContent = message;
    }
</script>
</body>
</html>
