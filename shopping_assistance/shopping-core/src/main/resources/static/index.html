<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopping Assistant</title>

    <style>
        body {
            max-width: 760px;
            margin: 30px auto;
            padding: 0 16px;
            font-family: system-ui, sans-serif;
            background: #f6f7fb;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 18px #0001;
        }

        #messages {
            height: 460px;
            overflow-y: auto;
            margin: 20px 0;
        }

        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 10px;
            white-space: pre-wrap;
        }

        .user {
            background: #dbeafe;
            margin-left: 20%;
        }

        .assistant {
            background: #f1f5f9;
            margin-right: 20%;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .session-row {
            margin-top: 16px;
        }

        #customer {
            flex: 1;
        }

        input,
        select {
            flex: 1;
            padding: 12px;
        }

        button {
            padding: 12px 18px;
            cursor: pointer;
        }

        #status {
            color: #555;
            margin-top: 8px;
        }
    </style>
</head>

<body>
<div class="card">
    <h2>Shopping Assistant</h2>

    <div id="login">
        <div class="row">
            <input id="email"
                   type="email"
                   placeholder="Customer email">

            <button onclick="login()">Sign in</button>
        </div>
    </div>

    <div id="chat" hidden>
        <div class="row">
            <span id="customer"></span>
            <button onclick="logout()">Sign out</button>
        </div>

        <div class="row session-row">
            <button id="new-chat" onclick="createSession()">
                New chat
            </button>

            <select id="session-selector"
                    aria-label="Select chat"
                    onchange="switchSession(this.value)">
            </select>

            <button id="delete-chat" onclick="deleteCurrentSession()">
                Delete chat
            </button>
        </div>

        <div id="messages"></div>

        <form id="chat-form" class="row">
            <input id="query"
                   placeholder="Ask about your cart or orders"
                   autocomplete="off">

            <button type="submit">Send</button>
        </form>
    </div>

    <div id="status"></div>
</div>

<script>
    const api = "/api/v1";

    let token = localStorage.getItem("shopToken");
    let customerEmail = localStorage.getItem("customerEmail");
    let activeSessionId = null;
    let sessions = [];

    const loginSection = document.getElementById("login");
    const chatSection = document.getElementById("chat");
    const messages = document.getElementById("messages");
    const status = document.getElementById("status");
    const sessionSelector = document.getElementById("session-selector");
    const queryInput = document.getElementById("query");
    const deleteChatButton = document.getElementById("delete-chat");

    if (token) {
        showChat();
    }

    async function login() {
        const email = document.getElementById("email")
            .value
            .trim();

        if (!email) {
            setStatus("Enter an email address.");
            return;
        }

        setStatus("Signing in...");

        try {
            const response = await fetch(
                `${api}/auth/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({email})
                }
            );

            const data = await readResponse(response);

            token = data.access_token;
            customerEmail = data.customer?.email ?? email;

            localStorage.setItem("shopToken", token);
            localStorage.setItem(
                "customerEmail",
                customerEmail
            );

            await showChat();
            setStatus("");
        } catch (error) {
            setStatus(`Sign-in failed: ${error.message}`);
        }
    }

    document.getElementById("chat-form")
        .addEventListener("submit", async event => {
            event.preventDefault();

            const input = document.getElementById("query");
            const query = input.value.trim();

            if (!query) return;

            if (!activeSessionId) {
                setStatus("Create a chat before sending a message.");
                return;
            }

            input.value = "";
            addMessage("user", query);
            setStatus("Thinking...");

            try {
                const response = await fetch(
                    `${api}/chat`,
                    {
                        method: "POST",
                        headers: authHeaders(),
                        body: JSON.stringify({
                            sessionId: activeSessionId,
                            query
                        })
                    }
                );

                const data = await readResponse(response);
                addMessage("assistant", data.answer);
                await loadSessions(false);
                setStatus("");
            } catch (error) {
                addMessage(
                    "assistant",
                    `Request failed: ${error.message}`
                );
                setStatus("");
            }
        });

    function logout() {
        token = null;
        customerEmail = null;
        activeSessionId = null;
        sessions = [];

        localStorage.removeItem("shopToken");
        localStorage.removeItem("customerEmail");

        messages.innerHTML = "";
        sessionSelector.innerHTML = "";
        chatSection.hidden = true;
        loginSection.hidden = false;
        setStatus("");
    }

    async function showChat() {
        loginSection.hidden = true;
        chatSection.hidden = false;

        document.getElementById("customer").textContent =
            `Signed in as ${customerEmail ?? "customer"}`;

        try {
            await loadSessions(true);
            setStatus("");
        } catch (error) {
            setStatus(`Could not load chats: ${error.message}`);
        }
    }

    function authHeaders() {
        return {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        };
    }

    async function createSession() {
        setStatus("Creating chat...");

        try {
            const response = await fetch(
                `${api}/chat/sessions`,
                {
                    method: "POST",
                    headers: authHeaders(),
                    body: JSON.stringify({title: "New chat"})
                }
            );

            const session = await readResponse(response);
            activeSessionId = session.sessionId;
            messages.innerHTML = "";

            await loadSessions(false);
            updateControls();
            queryInput.focus();
            setStatus("");
        } catch (error) {
            setStatus(`Could not create chat: ${error.message}`);
        }
    }

    async function loadSessions(loadSelectedHistory) {
        const response = await fetch(
            `${api}/chat/sessions`,
            {headers: authHeaders()}
        );

        sessions = await readResponse(response);
        sessionSelector.innerHTML = "";

        for (const session of sessions) {
            const option = document.createElement("option");
            option.value = session.sessionId;
            option.textContent =
                `${session.title} · ${session.sessionId.slice(0, 8)}`;
            sessionSelector.appendChild(option);
        }

        const activeSessionStillExists = sessions.some(
            session => session.sessionId === activeSessionId
        );

        if (!activeSessionStillExists) {
            activeSessionId = sessions.length > 0
                ? sessions[0].sessionId
                : null;
            loadSelectedHistory = activeSessionId !== null;
        }

        if (activeSessionId) {
            sessionSelector.value = activeSessionId;
        } else {
            messages.innerHTML = "";
        }

        updateControls();

        if (loadSelectedHistory && activeSessionId) {
            await loadHistory();
        }
    }

    async function switchSession(sessionId) {
        if (!sessionId || sessionId === activeSessionId) {
            return;
        }

        activeSessionId = sessionId;
        setStatus("Loading chat...");

        try {
            await loadHistory();
            queryInput.focus();
            setStatus("");
        } catch (error) {
            setStatus(`Could not load chat: ${error.message}`);
        }
    }

    async function loadHistory() {
        messages.innerHTML = "";

        if (!activeSessionId) {
            return;
        }

        const response = await fetch(
            `${api}/chat/sessions/${activeSessionId}/history`,
            {headers: authHeaders()}
        );

        const history = await readResponse(response);

        for (const message of history) {
            if (message.role === "user" || message.role === "assistant") {
                addMessage(message.role, message.content);
            }
        }
    }

    async function deleteCurrentSession() {
        if (!activeSessionId) {
            return;
        }

        if (!window.confirm("Delete this chat and its history?")) {
            return;
        }

        setStatus("Deleting chat...");

        try {
            const response = await fetch(
                `${api}/chat/sessions/${activeSessionId}`,
                {
                    method: "DELETE",
                    headers: authHeaders()
                }
            );

            if (!response.ok) {
                await readResponse(response);
            }

            activeSessionId = null;
            messages.innerHTML = "";
            await loadSessions(true);
            setStatus("");
        } catch (error) {
            setStatus(`Could not delete chat: ${error.message}`);
        }
    }

    function updateControls() {
        const hasSession = Boolean(activeSessionId);
        sessionSelector.disabled = sessions.length === 0;
        deleteChatButton.disabled = !hasSession;
        queryInput.disabled = !hasSession;
        queryInput.placeholder = hasSession
            ? "Ask about your cart or orders"
            : "Create a chat to begin";
    }

    function addMessage(role, content) {
        const element = document.createElement("div");
        element.className = `message ${role}`;
        element.textContent = content;

        messages.appendChild(element);
        messages.scrollTop = messages.scrollHeight;
    }

    async function readResponse(response) {
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.detail ??
                data.title ??
                `HTTP ${response.status}`
            );
        }

        return data;
    }

    function setStatus(message) {
        status.textContent = message;
    }
</script>
</body>
</html>
